name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions nedovoli pouzit "secrets" primo v "if:" podmince kroku,
      # proto se nejdriv ulozi do promenne prostredi na urovni jobu.
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jazyky-app-debug
          path: app/build/outputs/apk/debug/*.apk

      # --- Release build (podepsany, pro Google Play) ---
      # Spusti se JEN pokud jsou v repozitari nastavene GitHub Secrets
      # (Settings -> Secrets and variables -> Actions):
      #   RELEASE_KEYSTORE_BASE64  - obsah .keystore souboru zakodovany v base64
      #   RELEASE_STORE_PASSWORD   - heslo ke keystore
      #   RELEASE_KEY_ALIAS        - alias klice (jazyky-trainer-key)
      #   RELEASE_KEY_PASSWORD     - heslo ke klici (u PKCS12 stejne jako store password)
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d -i > "${{ github.workspace }}/release.keystore"
          echo "Velikost dekodovaneho keystore souboru:"
          ls -la "${{ github.workspace }}/release.keystore"

      - name: Build signed release APK + AAB
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - name: Upload release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: jazyky-app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB (pro Google Play)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: jazyky-app-release-aab
          path: app/build/outputs/bundle/release/*.aab
